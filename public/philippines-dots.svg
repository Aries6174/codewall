<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 228.4" role="img" aria-label="Dot-matrix silhouette of the Philippine archipelago">
<defs>
  <style>
    .pixel {
      fill: #E6DDC9;
      opacity: 0.9;
      animation: dotFlicker 5s ease-in-out infinite;
    }

    .f1 { animation-duration: 3.8s; animation-delay: -1.4s; }
    .f2 { animation-duration: 5.2s; animation-delay: -3.1s; }
    .f3 { animation-duration: 4.4s; animation-delay: -0.8s; }
    .f4 { animation-duration: 6.1s; animation-delay: -4.2s; }

    @keyframes dotFlicker {
      0%, 100% { opacity: 0.9; }
      45% { opacity: 0.55; }
      75% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pixel {
        animation: none;
      }
    }

    .scan-line {
      animation: scanMove 7s linear infinite;
      opacity: 0.55;
    }

    @keyframes scanMove {
      0% {
        transform: translateY(-10px);
        opacity: 0;
      }

      10% {
        opacity: 0.9;
      }

      90% {
        opacity: 0.9;
      }

      100% {
        transform: translateY(240px);
        opacity: 0.9;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .scan-line {
        animation: none;
        opacity: 0;
      }
    }

  </style>

  <pattern
    id="gridDots"
    width="9.8"
    height="9.8"
    patternUnits="userSpaceOnUse"
  >
