    <circle class="pixel f3" cx="3.55" cy="1.1" r="0.5"/>
    <circle class="pixel f2" cx="6" cy="1.1" r="0.5"/>
    <circle class="pixel f4" cx="8.45" cy="1.1" r="0.5"/>

    <circle class="pixel f4" cx="1.1" cy="3.55" r="0.5"/>
    <circle class="pixel f2" cx="3.55" cy="3.55" r="0.5"/>
    <circle class="pixel f1" cx="6" cy="3.55" r="0.5"/>
    <circle class="pixel f3" cx="8.45" cy="3.55" r="0.5"/>

    <circle class="pixel f3" cx="1.1" cy="6" r="0.5"/>
    <circle class="pixel f1" cx="3.55" cy="6" r="0.5"/>
    <circle class="pixel f4" cx="6" cy="6" r="0.5"/>
    <circle class="pixel f2" cx="8.45" cy="6" r="0.5"/>

    <circle class="pixel f2" cx="1.1" cy="8.45" r="0.5"/>
    <circle class="pixel f4" cx="3.55" cy="8.45" r="0.5"/>
    <circle class="pixel f3" cx="6" cy="8.45" r="0.5"/>
    <circle class="pixel f1" cx="8.45" cy="8.45" r="0.5"/>
  </pattern>
